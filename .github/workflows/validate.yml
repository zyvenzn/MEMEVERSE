name: Validate MEMEVERSE

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax and config checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js && node --check supabase-config.js
      - name: Check browser config does not contain service-role secrets
        run: |
          if grep -Eiq 'service_role|sb_secret_' supabase-config.js; then
            echo "A server-only Supabase credential was found in browser config."
            exit 1
          fi
