<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>MEMEVERSE — Virtual Economy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ios-statusbar" aria-hidden="true"><span>9:41</span><i class="ios-dynamic-island"></i><span class="ios-status-icons">● ᯤ ▰</span></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">M</span><div><b>MEMEVERSE</b><small>VIRTUAL ECONOMY</small></div></div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="nav">
        <button class="nav-item active" data-page="overview">◈ <span>Overview</span></button>
        <button class="nav-item" data-page="x">𝕏 <span>X Network</span></button>
        <button class="nav-item" data-page="telegram">➤ <span>Telegram</span></button>
        <button class="nav-item" data-page="discord">◉ <span>Discord</span></button>
        <button class="nav-item" data-page="pump">🚀 <span>Pump.fun</span></button>
        <button class="nav-item" data-page="trading">⌁ <span>Trading</span></button>
        <button class="nav-item" data-page="market">▦ <span>Marketplace</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="avatar">T</div><div><b>Test Trader</b><small>Demo account</small></div><span class="online"></span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-heading"><span class="eyebrow">YOUR WEB3 UNIVERSE</span><h1 id="page-title">Universe Dashboard</h1></div><label class="dashboard-search"><span>⌕</span><input type="search" placeholder="Search MEMEVERSE..." aria-label="Search MEMEVERSE"><kbd>⌘ K</kbd></label>
        <div class="top-actions"><span class="status"><i></i> Demo mode</span><div class="balance"><small>MAIN BALANCE</small><b id="top-balance">$10,000.00</b></div></div>
      </header>
      <section id="content"></section>
      <nav class="mobile-dock" id="mobile-dock" aria-label="Mobile navigation">
        <button class="dock-item active" data-page="overview"><span>⌂</span><small>Home</small></button>
        <button class="dock-item" data-page="x"><span>𝕏</span><small>Social</small></button>
        <button class="dock-item" data-page="pump"><span>🚀</span><small>Launch</small></button>
        <button class="dock-item" data-page="trading"><span>⌁</span><small>Markets</small></button>
        <button class="dock-item" data-page="telegram"><span>➤</span><small>Messages</small></button>
      </nav>
      <footer>MEMEVERSE prototype · Virtual currency only · Not connected to real financial markets</footer>
    </main>
  </div>

  <button id="auth-launcher" class="auth-launcher" type="button">Sign in / Create account</button>
  <section id="auth-modal" class="auth-modal" hidden aria-modal="true" role="dialog" aria-labelledby="auth-title">
    <div class="auth-card">
      <button id="auth-close" class="auth-close" type="button" aria-label="Close">×</button>
      <p class="auth-eyebrow">MEMEVERSE ACCOUNT</p>
      <h2 id="auth-title">Welcome back</h2>
      <p id="auth-account-state" class="auth-account-state">Not signed in</p>
      <form id="auth-form">
        <label id="auth-name-field" hidden>Display name<input id="auth-display-name" type="text" maxlength="40" autocomplete="name" placeholder="Your name"></label>
        <label id="auth-email-field">Email<input id="auth-email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
        <label id="auth-password-field">Password<input id="auth-password" type="password" minlength="8" autocomplete="current-password" placeholder="At least 8 characters"></label>
        <button id="auth-forgot" class="auth-text-button" type="button">Forgot password?</button>
        <button id="auth-submit" class="auth-submit" type="submit">Sign in</button>
      </form>
      <button id="auth-signout" class="auth-submit auth-signout" type="button" hidden>Sign out</button>
      <button id="auth-switch" class="auth-text-button auth-switch" type="button">New to MEMEVERSE? Create account</button>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
